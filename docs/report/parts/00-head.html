<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mishkaat — Scientific &amp; Engineering Report</title>
<style>
  @page { size: A4; margin: 18mm 18mm 18mm 18mm; }

  :root{
    --ink:#16202e;
    --ink-soft:#48566b;
    --rule:#d9e0e8;
    --rule-soft:#eceff3;
    --accent:#0f6b4f;
    --accent-soft:#e7f2ed;
    --accent-2:#8a6a1f;
    --code-bg:#f5f7f9;
  }

  *{ box-sizing:border-box; }

  body{
    font-family: Georgia, "Times New Roman", serif;
    font-size: 10.4pt;
    line-height: 1.55;
    color: var(--ink);
    margin: 0;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  h1,h2,h3,h4,h5{
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--ink);
    line-height:1.25;
    margin: 0 0 .4em;
    page-break-after: avoid;
    break-after: avoid;
  }

  h1.chapter{
    font-size: 19pt;
    letter-spacing:-.01em;
    padding-bottom:.35em;
    border-bottom: 2.5px solid var(--accent);
    margin-bottom:.9em;
  }
  h1.chapter .num{
    display:block;
    font-size:9pt;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:.5em;
    font-weight:700;
  }
  h2{ font-size: 13pt; margin-top:1.5em; color:#12354c; }
  h3{ font-size: 11.2pt; margin-top:1.3em; color:#1d3346; }
  h4{ font-size: 10.2pt; margin-top:1.1em; color:var(--ink-soft); text-transform:none; }

  p{ margin:0 0 .7em; text-align:justify; hyphens:auto; }
  ul,ol{ margin:0 0 .8em; padding-left:1.15em; }
  li{ margin-bottom:.3em; }
  li>ul,li>ol{ margin-top:.3em; }

  code, .mono{
    font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 8.8pt;
    background: var(--code-bg);
    padding: .08em .35em;
    border-radius: 3px;
    border:1px solid var(--rule-soft);
  }
  pre{
    font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 8.5pt;
    line-height:1.45;
    background: var(--code-bg);
    border:1px solid var(--rule);
    border-left:3px solid var(--accent);
    border-radius:4px;
    padding:.8em 1em;
    overflow-x:auto;
    white-space:pre;
    margin:.6em 0 1em;
    page-break-inside:avoid;
  }
  pre code{ background:none; border:none; padding:0; font-size:inherit; }

  table{
    width:100%;
    border-collapse:collapse;
    font-size:8.9pt;
    margin:.5em 0 1.1em;
    page-break-inside:auto;
  }
  caption{
    caption-side:top;
    text-align:left;
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    font-size:8.6pt;
    font-weight:700;
    color:var(--accent);
    padding-bottom:.45em;
    letter-spacing:.02em;
  }
  th{
    background:var(--accent-soft);
    color:#0b3d2c;
    text-align:left;
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    font-size:8.4pt;
    font-weight:700;
    padding:.45em .6em;
    border:1px solid var(--rule);
    vertical-align:bottom;
  }
  td{
    padding:.42em .6em;
    border:1px solid var(--rule);
    vertical-align:top;
  }
  tbody tr:nth-child(even) td{ background:#fafbfc; }
  tr{ page-break-inside:avoid; }
  td.mono, th.mono{ font-family:"SF Mono",Menlo,Consolas,monospace; font-size:8.1pt; }
  td.c{ text-align:center; }
  td.num{ text-align:right; font-variant-numeric:tabular-nums; }

  .ar{ font-family:"Geeza Pro","Noto Naskh Arabic","Segoe UI",Tahoma,serif; direction:rtl; unicode-bidi:isolate; }

  .chapter-page{ page-break-before:always; break-before:page; }

  .note{
    background:#fbfaf4;
    border:1px solid #e6dfc4;
    border-left:3px solid var(--accent-2);
    border-radius:4px;
    padding:.7em .95em;
    margin:.8em 0 1.1em;
    font-size:9.6pt;
    page-break-inside:avoid;
  }
  .note .lbl{
    display:block;
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    font-size:7.8pt;
    font-weight:700;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--accent-2);
    margin-bottom:.3em;
  }
  .note.warn{ background:#fdf6f5; border-color:#eccfc9; border-left-color:#a8392a; }
  .note.warn .lbl{ color:#a8392a; }
  .note.key{ background:var(--accent-soft); border-color:#c6ded4; border-left-color:var(--accent); }
  .note.key .lbl{ color:var(--accent); }

  figure{ margin:1em 0 1.3em; page-break-inside:avoid; }
  figcaption{
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    font-size:8.4pt;
    color:var(--ink-soft);
    text-align:center;
    margin-top:.55em;
  }
  .diagram{
    font-family:"SF Mono",Menlo,Consolas,monospace;
    font-size:8.1pt;
    line-height:1.35;
    white-space:pre;
    background:#fbfcfd;
    border:1px solid var(--rule);
    border-radius:4px;
    padding:1em 1.1em;
    overflow-x:auto;
    text-align:left;
    page-break-inside:avoid;
    break-inside:avoid;
  }
  .diagram + figcaption{ page-break-before:avoid; break-before:avoid; }
  .formula{
    font-family:Georgia,serif;
    font-style:italic;
    background:#fbfcfd;
    border:1px solid var(--rule);
    border-radius:4px;
    padding:.7em 1em;
    margin:.6em 0 1em;
    font-size:10pt;
    page-break-inside:avoid;
  }
  .formula .where{ font-style:normal; font-size:8.8pt; color:var(--ink-soft); display:block; margin-top:.5em; }

  /* ---------- cover ---------- */
  .cover{
    height:252mm;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    page-break-after:always;
  }
  .cover .top{ border-top:6px solid var(--accent); padding-top:1.6em; }
  .cover .eyebrow{
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    font-size:9pt; letter-spacing:.22em; text-transform:uppercase;
    color:var(--accent); font-weight:700;
  }
  .cover h1{
    font-size:37pt; line-height:1.05; margin:.45em 0 .1em; letter-spacing:-.02em;
    border:none;
  }
  .cover .arname{
    font-family:"Geeza Pro","Noto Naskh Arabic",serif;
    direction:rtl; font-size:22pt; color:var(--accent); margin:.1em 0 .5em;
  }
  .cover h2.sub{
    font-size:14pt; font-weight:400; color:var(--ink-soft); margin:.2em 0 0; border:none;
    line-height:1.4;
  }
  .cover .rule{ height:1px; background:var(--rule); margin:2.2em 0; }
  .cover dl{ margin:0; font-size:10pt; }
  .cover dl div{ display:flex; gap:1em; padding:.42em 0; border-bottom:1px solid var(--rule-soft); }
  .cover dt{
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    font-size:8.2pt; letter-spacing:.09em; text-transform:uppercase;
    color:var(--ink-soft); width:46mm; flex:none; padding-top:.22em; font-weight:700;
  }
  .cover dd{ margin:0; }
  .cover .foot{
    font-size:8.6pt; color:var(--ink-soft);
    border-top:1px solid var(--rule); padding-top:1em;
  }

  /* ---------- TOC ---------- */
  .toc{ font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; font-size:9.4pt; }
  .toc ol{ list-style:none; padding:0; margin:0; }
  .toc > ol > li{ margin:.55em 0 .1em; }
  .toc .lvl1{
    display:flex; gap:.7em; font-weight:700; color:var(--ink);
    border-bottom:1px solid var(--rule-soft); padding-bottom:.25em;
  }
  .toc .lvl1 .n{ color:var(--accent); width:8mm; flex:none; }
  .toc .lvl1 > span:nth-child(2){ flex:1; }
  .toc .lvl1 .pg{ flex:none; width:9mm; text-align:right; color:var(--accent); font-variant-numeric:tabular-nums; }
  .toc ol ol{ margin:.25em 0 .5em; }
  .toc .lvl2{ display:flex; gap:.7em; font-weight:400; color:var(--ink-soft); font-size:8.9pt; padding:.12em 0 .12em 8mm; }
  .toc .lvl2 .n{ width:11mm; flex:none; }

  .stat-grid{ display:flex; flex-wrap:wrap; gap:.55em; margin:.8em 0 1.2em; }
  .stat{
    flex:1 1 30%; min-width:38mm;
    border:1px solid var(--rule); border-top:3px solid var(--accent);
    border-radius:4px; padding:.6em .75em; background:#fbfcfd;
  }
  .stat .v{ font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; font-size:17pt; font-weight:700; color:var(--accent); line-height:1; }
  .stat .k{ font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; font-size:7.7pt; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); margin-top:.35em; }

  .abstract{
    background:#fbfcfd; border:1px solid var(--rule); border-radius:5px;
    padding:1.1em 1.3em; font-size:10pt;
  }
  .lead{ font-size:11pt; color:var(--ink-soft); }
  .small{ font-size:8.8pt; color:var(--ink-soft); }
  .tag{
    display:inline-block; font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    font-size:7.4pt; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    padding:.12em .45em; border-radius:3px; background:var(--accent-soft); color:#0b3d2c;
    border:1px solid #c6ded4;
  }
  .tag.no{ background:#fbeeec; color:#8f3325; border-color:#eccfc9; }
  .tag.warn{ background:#fdf6e8; color:#7a5c12; border-color:#e8dcbb; }
  .tag.neutral{ background:#eef1f4; color:#4a5866; border-color:#dde3e9; }
</style>
</head>
<body>
