# =============================================================================
# Mishkaat — production stack
# Network topology:
#   Internet → Nginx (TLS, security headers, rate-limit) → app (8001) → mongo (27017)
#   Only Nginx is exposed publicly. App and Mongo are on an internal-only network.
# =============================================================================
services:

  mongo:
    image: mongo:7.0
    restart: unless-stopped
    command: ["mongod", "--auth", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${DB_NAME:-quran_center}
      # [إصلاح 2026-09-03 — كان يمنع الحزمة من الإقلاع أصلاً]
      # ops/mongo-init.js يقرأ هذين ليُنشئ مستخدم التطبيق المحدود الصلاحية، ولم يكونا يصلان
      # إلى حاوية mongo إطلاقاً. فيطبع السكربت "skipping app user creation" ولا يُنشأ المستخدم،
      # ثم يحاول التطبيق الاتصال بـ MONGO_APP_USER فيفشل التوثيق ولا تقوم الخدمة.
      MONGO_APP_USER: ${MONGO_APP_USER:?set MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - ./ops/mongo-init.js:/docker-entrypoint-initdb.d/01-init.js:ro
    networks:
      - internal
    # Do NOT publish ports — Mongo must never be reachable from outside the host.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: production
      MONGO_URL: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/${DB_NAME:-quran_center}?authSource=${DB_NAME:-quran_center}
      UVICORN_WORKERS: "4"
      # آمن هنا تحديداً: التطبيق لا ينشر منفذاً وهو على شبكة داخلية، فلا يصله طلب إلا عبر nginx،
      # وnginx يضبط X-Forwarded-For بنفسه (ops/proxy-headers.conf). بدون هذا السطر يقرأ حدّ
      # المحاولات عنوان حاوية nginx لكل المستخدمين، فتقفل خمسُ محاولات خاطئة من شخص واحد المركز كلّه.
      TRUST_PROXY: "true"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - internal
    # No published port — only Nginx talks to the app via the internal network.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ops/tls:/etc/nginx/tls:ro          # mount your fullchain.pem + privkey.pem here
      - certbot_webroot:/var/www/certbot:ro
    networks:
      - internal
      - public

networks:
  internal:
    internal: true       # no outbound internet for these services
  public:

volumes:
  mongo_data:
  certbot_webroot:
