# Shared proxy headers — included by every /api/ location in nginx.conf
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Connection        "";
proxy_read_timeout  30s;
proxy_send_timeout  30s;
proxy_connect_timeout 5s;
proxy_buffering on;

# [إصلاح 2026-09-03] منع ازدواج الرؤوس الأمنية.
# التطبيق صار يرسل رؤوسه بنفسه (شبكة أمان للتشغيل بلا nginx: التطوير أو وكيل آخر)، وnginx
# يرسلها أيضاً على مستوى server. رأسان لـ X-Frame-Options قد تتجاهلهما بعض المتصفحات معاً،
# وسياستا CSP تُطبَّقان بالتقاطع فتُفاجئ من يصحّح خللاً. نُخفي نسخة التطبيق ونُبقي نسخة nginx
# التي تحكم الواجهة والـ API معاً.
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Content-Security-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header Strict-Transport-Security;
