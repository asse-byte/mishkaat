# =============================================================================
# Mishkaat — Nginx reverse-proxy config
# Place your TLS cert at /etc/nginx/tls/fullchain.pem and key at /etc/nginx/tls/privkey.pem
# Replace `app.your-domain.example` with your real hostname.
# =============================================================================

user  nginx;
worker_processes auto;
events { worker_connections 4096; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;                          # do not advertise nginx version
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 2m;                    # API does not accept large bodies
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 15s;

    # Edge rate-limit zones — defense in depth on top of the app's MongoDB-backed limiter
    limit_req_zone $binary_remote_addr zone=mishkaat_login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=mishkaat_register:10m rate=3r/h;
    limit_req_zone $binary_remote_addr zone=mishkaat_api:10m rate=60r/s;

    # Logging
    log_format mishkaat '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" '
                       'rt=$request_time uct=$upstream_connect_time '
                       'urt=$upstream_response_time';
    access_log /var/log/nginx/access.log mishkaat;
    error_log  /var/log/nginx/error.log warn;

    upstream mishkaat_backend {
        server app:8001;
        keepalive 32;
    }

    # ---- HTTP → HTTPS redirect, with ACME challenge passthrough ----
    server {
        listen 80;
        listen [::]:80;
        server_name app.your-domain.example;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- HTTPS server ----
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name app.your-domain.example;

        ssl_certificate     /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM:!aNULL:!MD5;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        # Hard rate-limit on login (5/min) — bot brute-force shield
        location = /api/auth/login {
            limit_req zone=mishkaat_login burst=3 nodelay;
            proxy_pass http://mishkaat_backend;
            include /etc/nginx/proxy-headers.conf;
        }

        # Hard rate-limit on public center registration (3/hour)
        location = /api/public/register-center {
            limit_req zone=mishkaat_register burst=1 nodelay;
            proxy_pass http://mishkaat_backend;
            include /etc/nginx/proxy-headers.conf;
        }

        # General API rate-limit (60 req/s with bursts)
        location /api/ {
            limit_req zone=mishkaat_api burst=120 nodelay;
            proxy_pass http://mishkaat_backend;
            include /etc/nginx/proxy-headers.conf;
        }

        # Static frontend (served separately or via this same proxy)
        location / {
            root /var/www/mishkaat-frontend;
            try_files $uri $uri/ /index.html;
        }
    }
}
