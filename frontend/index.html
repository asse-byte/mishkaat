  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Clean up and unregister Service Worker in local development to prevent aggressive caching of garbled text
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname.startsWith('10.')) {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            if (registrations.length > 0) {
              console.log('Development mode: Unregistering active Service Workers to clear cached assets.');
              for (let registration of registrations) {
                registration.unregister();
              }
              // Clear caches
              if ('caches' in window) {
                caches.keys().then((keys) => {
                  Promise.all(keys.map(key => caches.delete(key))).then(() => {
                    console.log('Caches cleared. Reloading page...');
                    window.location.reload();
                  });
                });
              } else {
                window.location.reload();
              }
            }
          });
        }
      } else {
        // Production: Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .then((registration) => {
                console.log('SW registered:', registration);
              })
              .catch((error) => {
                console.log('SW registration failed:', error);
              });
          });
        }
      }
    </script>
