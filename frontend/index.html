<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover لازم لهواتف ذات الشقّ (iPhone X فما فوق): بدونه يُحشر
         التطبيق بين شريطين رماديين في الوضع الأفقي. الحشوة الآمنة في index.css. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="نظام المشكاة لإدارة دور ومراكز تحفيظ القرآن الكريم - Mishkaat Quran & Islamic Center Management System - Logiciel d'administration pour les écoles de Coran">
    <meta name="keywords" content="المشكاة, mishkaat, quran center, Coran, تحفيظ القرآن, إدارة المراكز, مدارس إسلامية, Quran school management, islamic center software, logiciel écoles coraniques">

    <!-- أيقونات المتصفّح. النسخة المتّجهة أولاً (تبقى حادّة في كل قياس)، وملف
         ico لطلب /favicon.ico الذي ترسله بعض المتصفّحات والقارئات تلقائياً. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
    <link rel="shortcut icon" href="/favicon.ico">

    <!-- شريط المتصفّح يتبع مظهر الجهاز: ورق دافئ نهاراً، وجوف الكوّة ليلاً -->
    <meta name="theme-color" content="#F5F3EF" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#141B2E" media="(prefers-color-scheme: dark)">

    <!-- التثبيت على أندرويد وسطح المكتب -->
    <link rel="manifest" href="/manifest.json">
    <meta name="application-name" content="المشكاة">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="msapplication-TileColor" content="#1B233C">
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png">

    <!-- التثبيت على iOS. apple-mobile-web-app-capable هو ما يجعل التطبيق يفتح
         مستقلّاً بلا شريط سفاري؛ غيابه كان يفتحه كصفحة ويب عادية. والاسم هنا هو
         ما يُكتب تحت الأيقونة في شاشة الآيفون، فيجب أن يكون قصيراً: iOS يقصّ ما
         تجاوز ~12 محرفاً بثلاث نقاط. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="المشكاة">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">

    <!-- معاينة الروابط في واتساب وتيليجرام ومواقع التواصل -->
    <meta property="og:site_name" content="المشكاة">
    <meta property="og:title" content="المشكاة | نظام إدارة دور ومراكز تحفيظ القرآن الكريم">
    <meta property="og:description" content="نظام المشكاة هو منصة متكاملة وسحابية لإدارة مراكز ودور تحفيظ القرآن الكريم بموثوقية وأمان.">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ar_AR">
    <meta property="og:image" content="/icons/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="المشكاة | نظام إدارة دور القرآن الكريم">
    <meta name="twitter:image" content="/icons/og-image.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <title>المشكاة | نظام إدارة دور القرآن الكريم</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Clean up and unregister Service Worker in local development to prevent aggressive caching of garbled text
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname.startsWith('10.')) {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            if (registrations.length > 0) {
              console.log('Development mode: Unregistering active Service Workers to clear cached assets.');
              for (let registration of registrations) {
                registration.unregister();
              }
              // Clear caches
              if ('caches' in window) {
                caches.keys().then((keys) => {
                  Promise.all(keys.map(key => caches.delete(key))).then(() => {
                    console.log('Caches cleared. Reloading page...');
                    window.location.reload();
                  });
                });
              } else {
                window.location.reload();
              }
            }
          });
        }
      } else {
        // Production: Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .then((registration) => {
                console.log('SW registered:', registration);
              })
              .catch((error) => {
                console.log('SW registration failed:', error);
              });
          });
        }
      }
    </script>
  </body>
</html>
